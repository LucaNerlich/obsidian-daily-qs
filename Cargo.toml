[package]
name = "obsidian-daily-qs"
version = "1.4.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Omarchy Quattro bar widget backend for Obsidian daily notes todos"
readme = "README.md"
repository = "https://github.com/LucaNerlich/obsidian-daily-qs"
keywords = ["omarchy", "obsidian", "daily-notes", "quickshell"]
categories = ["command-line-utilities"]

[lib]
name = "obsidian_daily_qs"
path = "src/lib.rs"

[[bin]]
name = "obsidian-daily-qs"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
# Keep the symbol table. Marketplace review inspects this ELF with `nm`;
# `strip = true` or `"symbols"` is a listing rejection.
strip = "debuginfo"
