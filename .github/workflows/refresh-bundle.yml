name: Refresh marketplace bundle

# Builds omarchy/bin on native runners and uploads the ELFs + hashes + srcid as
# an artifact for commit. Does not push.
on:
  workflow_dispatch:

concurrency:
  group: refresh-bundle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle:
    name: build musl bundle artifact (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: refresh-bundle-${{ matrix.target }}

      # Only this job's own target: this runner only has that one target's
      # std installed above.
      - name: Build bundle
        run: scripts/build-bundle.sh ${{ matrix.target }}

      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omarchy-bin-${{ matrix.target }}
          path: |
            omarchy/bin/obsidian-daily-qs-${{ matrix.arch }}
            omarchy/bin/obsidian-daily-qs-${{ matrix.arch }}.sha256
            omarchy/bin/obsidian-daily-qs.srcid
