name: Refresh marketplace bundle

# Builds omarchy/bin on ubuntu-latest (same host as verify-bundle) and uploads
# the ELF + hash + srcid as an artifact for commit. Does not push.
on:
  workflow_dispatch:

concurrency:
  group: refresh-bundle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle:
    name: build musl bundle artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          targets: x86_64-unknown-linux-musl
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: refresh-bundle-musl

      - name: Build bundle
        run: scripts/build-bundle.sh

      - name: Upload bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: omarchy-bin
          path: |
            omarchy/bin/obsidian-daily-qs
            omarchy/bin/obsidian-daily-qs.sha256
            omarchy/bin/obsidian-daily-qs.srcid
