name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap gate so QML/README/doc-only commits skip the expensive Rust jobs
  # below. The diff-base logic lives in scripts/ci-changed-paths.sh (a plain
  # `git diff`, no third-party action, no extra supply-chain dependency);
  # anything we can't compute a sensible diff base for (workflow_dispatch,
  # first push, force-push) defaults to `true` so we never silently skip a
  # check we're unsure about.
  changes:
    name: detect changed paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: filter
        run: scripts/ci-changed-paths.sh "${{ github.event_name }}" "${{ github.event.pull_request.base.sha }}" "${{ github.event.before }}" "${{ github.sha }}" >> "$GITHUB_OUTPUT"

  linux:
    name: test (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Match rust-toolchain.toml. `@stable` installs clippy/rustfmt on the
      # `stable` toolchain name, but the pin overrides cargo to `1.98.1`, which
      # then fails `cargo fmt` with "cargo-fmt is not installed".
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.98.1
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

  # Split out from `linux` so omarchy/*.js changes still get checked even on
  # commits that skip the Rust jobs above (it needs no Rust toolchain).
  plugin-model-tests:
    name: plugin model tests (Model.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Plugin model tests
        run: node omarchy/model.test.mjs

      - name: Watch restart state-machine tests
        run: node omarchy/watch-restart.test.mjs

  # No separate msrv job: rust-version in Cargo.toml is pinned to the same
  # 1.98.1 toolchain used everywhere else (rust-toolchain.toml), so a
  # dedicated "does it build on the declared minimum" job would just rebuild
  # under the exact same toolchain the `linux` job above already uses.

  # Independent of linux/changes: marketplace review needs this job to run
  # on every commit, even one that only touches QML, and even if a
  # prerequisite such as rustfmt is missing. A skipped verify cannot attest
  # that the bundled ELF matches the reviewed source. Do not add `needs:`
  # here. The tag Release workflow re-runs the same script in strict mode.
  #
  # Bundles are refreshed only in the release PR (see AGENTS.md), so a commit
  # that leaves omarchy/bin/ alone may carry a bundle whose source fingerprint
  # trails src/. Those commits still get the integrity attestation (recorded
  # hash, non-stripped, inspectable) but skip the byte-for-byte rebuild, which
  # can only pass while the fingerprint is current. Any commit that edits
  # omarchy/bin/ itself — and any bundle that is current — is verified
  # strictly.
  verify-bundle:
    name: marketplace bundle (inspectable, reproducible)
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Fail closed: only the combination "this change does not touch
      # omarchy/bin/ and the committed bundle is already stale" relaxes the
      # check; anything unsure (e.g. no resolvable diff base) demands a fresh
      # bundle.
      - name: Decide bundle verification mode
        id: bundle-mode
        run: |
          set -euo pipefail
          changed="$(scripts/ci-changed-paths.sh "${{ github.event_name }}" "${{ github.event.pull_request.base.sha }}" "${{ github.event.before }}" "${{ github.sha }}" | awk -F= '$1 == "bundle" { print $2 }')"
          recorded="$(awk '{print $1}' omarchy/bin/obsidian-daily-qs.srcid)"
          current="$(scripts/bundle-source-id.sh)"
          if [[ "$changed" == "false" ]] && [[ "$recorded" != "$current" ]]; then
            echo "strict=false" >> "$GITHUB_OUTPUT"
            echo "::notice::the committed bundle trails src/ by design (it is refreshed in the release PR, see AGENTS.md) and this change leaves omarchy/bin/ alone: verifying integrity only"
          else
            echo "strict=true" >> "$GITHUB_OUTPUT"
          fi

      # Inspect before installing the pinned toolchain so a rustup failure
      # cannot skip the non-stripped / recorded-hash / source-id attestation.
      # The source-id check catches a leftover ELF after a comment-only Rust
      # edit without waiting for the musl rebuild.
      - name: Inspect committed ELF
        env:
          VERIFY_BUNDLE_ALLOW_STALE: ${{ steps.bundle-mode.outputs.strict == 'true' && '0' || '1' }}
        run: VERIFY_BUNDLE_SKIP_REBUILD=1 scripts/verify-bundle.sh ${{ matrix.target }}

      # Pin to the toolchain in rust-toolchain.toml so the check reproduces
      # the exact binary that was committed.
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.98.1
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: verify-bundle-${{ matrix.target }}

      # Only rebuild this job's own target: each runner only has that one
      # target's std installed above, and cross-building the other arch's
      # target here is exactly what produced a mismatched, non-reproducible
      # binary in practice (the cross-built output doesn't byte-match a
      # native build of the same source).
      - name: Rebuild and compare byte-for-byte
        if: steps.bundle-mode.outputs.strict == 'true'
        run: scripts/verify-bundle.sh ${{ matrix.target }}
