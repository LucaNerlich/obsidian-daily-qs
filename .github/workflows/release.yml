name: Release

# Re-attests the marketplace bundle requirements on the tagged SHA, then
# publishes the GitHub Release. A skipped or failed verify must not produce
# a release asset for that tag.
on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    name: verify bundle (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Inspect committed ELF
        run: VERIFY_BUNDLE_SKIP_REBUILD=1 scripts/verify-bundle.sh ${{ matrix.target }}

      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-verify-${{ matrix.target }}

      # Only this job's own target: this runner only has that one target's
      # std installed above.
      - name: Marketplace bundle checks
        run: scripts/verify-bundle.sh ${{ matrix.target }}

  release:
    name: publish GitHub release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Package committed ELFs
        run: scripts/package-release.sh

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          x86_asset="dist/obsidian-daily-qs-${version}-linux-x86_64.tar.gz"
          aarch64_asset="dist/obsidian-daily-qs-${version}-linux-aarch64.tar.gz"
          notes="$(scripts/changelog-notes.sh "$version")"
          {
            echo "$notes"
            echo
            echo "Artifacts:"
            echo "- \`$(basename "$x86_asset")\` (statically linked musl x86_64)."
            echo "- \`$(basename "$aarch64_asset")\` (statically linked musl aarch64)."
          } > /tmp/release-notes.md
          gh release create "$tag" "$x86_asset" "$aarch64_asset" --title "$tag" --notes-file /tmp/release-notes.md
